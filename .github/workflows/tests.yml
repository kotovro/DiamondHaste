# Runs all GdUnit4 tests (tests/unit + tests/integration) on every push and pull request.
# Same suite as tools\run_tests.cmd locally.
name: Tests

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  checks: write   # test report as a check run
  actions: read

jobs:
  gdunit4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Models are not stored in git: fetch the ones listed in assets.lock.json
      # from Yandex Object Storage (read-only service account key in repo secrets).
      - name: Fetch models
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
        run: ./tools/fetch_assets.ps1 -Only assets

      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: "4.4.1"
          version: installed      # use addons/gdUnit4 from the repository (v5.1.1)
          paths: res://tests
          arguments: "-c"         # do not stop at the first failure
          timeout: 10
